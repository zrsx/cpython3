name: Regenerate CPython3 Android Artifacts

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  regen-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool pkg-config python3

      - name: Run Regeneration
        run: |
          ./android/regen.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-artifacts
          path: |
            android/linux_x86_64/
            android/bionic/
            Android-bionic.bp
            Android-linux_x86_64.bp
            android/Python/frozen_modules/

  regen-darwin:
    runs-on: macos-14 # Native Apple Silicon ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Dependencies
        run: |
          brew install autoconf libtool pkg-config

      - name: Run Regeneration
        run: |
          ./android/regen.sh

      - name: Upload Darwin Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-artifacts
          path: |
            android/darwin/
            Android-darwin.bp

  regen-linux-arm64:
    runs-on: ubuntu-24.04-arm # Correct native ARM64 runner label for public GitHub repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool pkg-config python3

      - name: Run Regeneration
        run: |
          ./android/regen.sh

      - name: Upload ARM64 Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-artifacts
          path: |
            android/linux_arm64/
            Android-linux_arm64.bp

  package-artifacts:
    needs: [regen-linux-x86_64, regen-darwin, regen-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Downloads all partial builds and merges them directly into the checkout workspace
      - name: Download and Merge All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-artifacts'
          path: .
          merge-multiple: true

      - name: Stage the Complete android Directory
        run: |
          # Create a temporary staging folder
          mkdir -p dist/
          
          # Copy the fully populated 'android' folder into the staging directory
          cp -r android dist/
          
          # Also include the generated top-level Soong Blueprint files in the staging folder
          cp *.bp dist/
          
          echo "Verified files inside staging folder (dist/):"
          ls -R dist/

      - name: Upload Final Structured Zip Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-structure-zip
          path: dist/
