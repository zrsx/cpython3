name: Regenerate CPython3 Android Artifacts

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: read

jobs:
  regen-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool pkg-config python3 clang

      # Mock AOSP's version tracking script to return clang-r596125
      - name: Create Mock Soong Scripts
        run: |
          mkdir -p /home/runner/build/soong/scripts
          cat << 'EOF' > /home/runner/build/soong/scripts/get_clang_version.py
          #!/usr/bin/env python3
          print("clang-r596125")
          EOF
          chmod +x /home/runner/build/soong/scripts/get_clang_version.py

      # Clone the main-kernel branch of the linux-x86 prebuilts (contains clang-r596125)
      - name: Clone Google Clang Prebuilt (linux-x86)
        run: |
          mkdir -p /home/runner/prebuilts/clang/host/
          git clone --depth 1 --branch main-kernel https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 /home/runner/prebuilts/clang/host/linux-x86

      # Clone the glibc-2.17 GCC prebuilt toolchain used by the x86_64 configuration
      - name: Clone Google GCC Prebuilt (linux-x86)
        run: |
          mkdir -p /home/runner/prebuilts/gcc/linux-x86/host/
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 /home/runner/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

      - name: Run Regeneration
        run: |
          # Prepend Google prebuilt compiler path to PATH
          export PATH="/home/runner/prebuilts/clang/host/linux-x86/clang-r596125/bin:$PATH"
          ./android/regen.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-artifacts
          path: |
            android/linux_x86_64/
            android/bionic/
            Android-bionic.bp
            Android-linux_x86_64.bp
            android/Python/frozen_modules/

  regen-darwin:
    runs-on: macos-14 # Native Apple Silicon ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          brew install autoconf libtool pkg-config

      # Mock AOSP's version tracking script to return nothing on macOS.
      # This forces the script to fallback cleanly to Xcode's native toolchain.
      - name: Create Mock Soong Scripts
        run: |
          mkdir -p /Users/runner/build/soong/scripts
          cat << 'EOF' > /Users/runner/build/soong/scripts/get_clang_version.py
          #!/usr/bin/env python3
          # Output nothing to trigger native macOS fallback
          EOF
          chmod +x /Users/runner/build/soong/scripts/get_clang_version.py

      - name: Run Regeneration
        run: |
          ./android/regen.sh

      - name: Upload Darwin Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-artifacts
          path: |
            android/darwin/
            Android-darwin.bp

  regen-linux-arm64:
    runs-on: ubuntu-24.04-arm # Native ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool pkg-config python3 clang

      # Mock AOSP's version tracking script for Linux ARM64 runner
      - name: Create Mock Soong Scripts
        run: |
          mkdir -p /home/runner/build/soong/scripts
          cat << 'EOF' > /home/runner/build/soong/scripts/get_clang_version.py
          #!/usr/bin/env python3
          print("clang-r596125")
          EOF
          chmod +x /home/runner/build/soong/scripts/get_clang_version.py

      # Clone the mirror-goog-main-llvm-toolchain-source branch of the linux-arm64 prebuilts (contains clang-r596125)
      - name: Clone Google Clang Prebuilt (linux-arm64)
        run: |
          mkdir -p /home/runner/prebuilts/clang/host/
          git clone --depth 1 --branch mirror-goog-main-llvm-toolchain-source https://android.googlesource.com/platform/prebuilts/clang/host/linux-arm64 /home/runner/prebuilts/clang/host/linux-arm64
          # Link linux-x86 to linux-arm64 to cover script architecture queries
          ln -s linux-arm64 /home/runner/prebuilts/clang/host/linux-x86

      # Perform a lightweight sparse-checkout for only the required musl sysroots
      - name: Sparse Checkout build-tools sysroots
        run: |
          mkdir -p /home/runner/prebuilts/build-tools
          cd /home/runner/prebuilts/build-tools
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/build-tools
          git config core.sparseCheckout true
          echo "sysroots/*" >> .git/info/sparse-checkout
          git pull --depth=1 origin main
      - name: Run Regeneration
        run: |
          # Inject -static into LDFLAGS (targets only the linux_arm64 musl target LDFLAGS line)
          sed -i "s/unwindlib=none/unwindlib=none -static/g" android/regen.sh
          # Prepend Google prebuilt compiler path to PATH
          export PATH="/home/runner/prebuilts/clang/host/linux-arm64/clang-r596125/bin:$PATH"
          ./android/regen.sh

      - name: Upload ARM64 Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-artifacts
          path: |
            android/linux_arm64/
            Android-linux_arm64.bp

  package-artifacts:
    needs: [regen-linux-x86_64, regen-darwin, regen-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download and Merge All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-artifacts'
          path: .
          merge-multiple: true

      - name: Stage the Complete android Directory
        run: |
          mkdir -p dist/
          cp -r android dist/
          cp ./*.bp dist/
          echo "Verified files inside staging folder (dist/):"
          ls -R dist/

      - name: Upload Final Structured Zip Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-structure-zip
          path: dist/
